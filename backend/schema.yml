        description: Um valor inteiro único que identifica este Exigência Nutricional
          (NRC).
        required: true
      tags:
      - exigencias
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExigenciaNRC'
          description: ''
