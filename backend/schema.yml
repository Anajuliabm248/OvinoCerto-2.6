            schema:
              $ref: '#/components/schemas/ExigenciaNRC'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExigenciaNRC'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExigenciaNRC'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExigenciaNRC'
          description: ''
  /api/exigencias/{id}/:
    get:
      operationId: exigencias_retrieve
      description: |-
        Tabela NRC de exigências nutricionais.

        - GET  /api/exigencias/                  → lista todas
        - GET  /api/exigencias/{id}/             → detalhe
        - GET  /api/exigencias/categorias/       → lista valores únicos de categoria
        - GET  /api/exigencias/lookup/           → busca a linha mais próxima
