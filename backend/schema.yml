          description: ''
  /api/exigencias/lookup/:
    get:
      operationId: exigencias_lookup_retrieve
      description: |-
        Retorna a exigência NRC mais adequada para os parâmetros fornecidos.

        Parâmetros obrigatórios: categoria, fase, pv_kg
        Parâmetros opcionais:    gmd (kg/dia), tipo_parto (1–5)
      tags:
      - exigencias
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
