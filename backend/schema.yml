      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFormulacaoListList'
          description: ''
    post:
      operationId: formulacao_create
      description: |-
        POST /api/formulacao/

        Corpo esperado:
        {
          "lote_id": 1,
          "exigencia_nrc_id": 10,
          "titulo": "Formulação lote A",
          "observacoes": ""
        }
      tags:
      - formulacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarFormulacaoInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IniciarFormulacaoInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IniciarFormulacaoInput'
        required: true
      security:
