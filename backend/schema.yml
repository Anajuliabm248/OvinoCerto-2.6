  /api/formulacao/:
    get:
      operationId: formulacao_list
      description: |-
        Endpoints de formulação pensados para uso direto na API navegável.

        Usa ModelViewSet para expor GET/POST em /api/formulacao/ no DRF,
        mas mantém os Application Services como caminho único das regras
        de negócio. POST /api/formulacao/ é um atalho para iniciar a
        formulação com lote + exigência NRC escolhida pelo usuário.
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - formulacao
