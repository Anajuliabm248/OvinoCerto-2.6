openapi: 3.0.3
info:
  title: API OvinoCerto
  version: 1.0.0
  description: projeto de formulação automatizado de ração para ovinos da UFSM
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/auth/login/  ->  valida credenciais e devolve tokens
        JWT.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: POST /api/auth/register/ ->  cria usuário e devolve tokens JWT.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/exigencias/:
    get:
      operationId: exigencias_list
      description: |-
        Tabela NRC de exigências nutricionais.

        - GET  /api/exigencias/                  → lista todas
        - GET  /api/exigencias/{id}/             → detalhe
        - GET  /api/exigencias/categorias/       → lista valores únicos de categoria
        - GET  /api/exigencias/lookup/           → busca a linha mais próxima
        - POST/PUT/DELETE                        → somente admin
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - exigencias
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExigenciaNRCList'
          description: ''
    post:
      operationId: exigencias_create
      description: |-
        Tabela NRC de exigências nutricionais.

        - GET  /api/exigencias/                  → lista todas
        - GET  /api/exigencias/{id}/             → detalhe
        - GET  /api/exigencias/categorias/       → lista valores únicos de categoria
        - GET  /api/exigencias/lookup/           → busca a linha mais próxima
        - POST/PUT/DELETE                        → somente admin
      tags:
      - exigencias
