components:
  schemas:
    CategoriaEnum:
      enum:
      - cordeiros_4_meses
      - cordeiros_8_meses
      - carneiro_4_meses
      - carneiro_8_meses
      - carneiros
      - ovelhas
      type: string
      description: |-
        * `cordeiros_4_meses` - Cordeiros(as) 4 meses
        * `cordeiros_8_meses` - Cordeiros(as) 8 meses
        * `carneiro_4_meses` - Carneiro 4 meses
        * `carneiro_8_meses` - Carneiro 8 meses
        * `carneiros` - Carneiros
        * `ovelhas` - Ovelhas
    ClassificacaoEnum:
      enum:
      - volumoso
      - concentrado
      type: string
      description: |-
        * `volumoso` - Volumoso
        * `concentrado` - Concentrado
    ExigenciaNRC:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        categoria:
          $ref: '#/components/schemas/CategoriaEnum'
        categoria_display:
          type: string
          readOnly: true
        fase:
          allOf:
          - $ref: '#/components/schemas/FaseEnum'
          title: Fase produtiva
        fase_display:
          type: string
          readOnly: true
        pv_kg:
          type: number
          format: double
          title: Peso vivo (kg)
        tipo_parto:
          nullable: true
          title: Tipo de parto
          description: |-
            Requerido para fases de gestação e lactação.

            * `1` - 1 Cordeiro
            * `2` - 2 Cordeiros
            * `3` - 3 Cordeiros
            * `4` - 4 Cordeiros
            * `5` - 5 Cordeiros
          minimum: 0
          maximum: 9223372036854775807
          oneOf:
          - $ref: '#/components/schemas/TipoPartoEnum'
          - $ref: '#/components/schemas/NullEnum'
        tipo_parto_display:
          type: string
          readOnly: true
        pv_nascer_kg:
          type: number
          format: double
          nullable: true
          title: PV ao nascer (kg)
        producao_leite_kg_dia:
          type: number
          format: double
          nullable: true
          title: Produção de leite (kg/dia)
        gmd_kg:
          type: number
          format: double
          nullable: true
          title: GMD (kg/dia)
        pv_percentual:
          type: number
          format: double
          nullable: true
          title: '% PV'
        cms_kg:
          type: number
          format: double
          nullable: true
          title: CMS (kg/dia)
        pb_g:
          type: number
          format: double
          nullable: true
          title: PB (g)
        pb_percentual:
          type: number
          format: double
          nullable: true
          title: PB (%)
        ndt_kg:
          type: number
          format: double
          nullable: true
          title: NDT (kg)
        ndt_percentual:
          type: number
          format: double
          nullable: true
          title: NDT (%)
        fdn_kg:
          type: number
          format: double
          nullable: true
          title: FDN (kg)
        fdn_percentual:
          type: number
          format: double
          nullable: true
          title: FDN (%)
        ee_kg:
          type: number
          format: double
          nullable: true
          title: EE (kg)
        ee_percentual:
          type: number
          format: double
          nullable: true
          title: EE (%)
        ca_g:
          type: number
          format: double
          nullable: true
          title: Ca (g)
        ca_percentual:
          type: number
          format: double
          nullable: true
          title: Ca (%)
        p_g:
          type: number
          format: double
          nullable: true
