{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{title}}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'global/css/styles.css' %}">
</head>
<body>
    {% include 'global/partials/_header.html' %}
    <main class="content">
        {% if messages %}
            <section class="messages" aria-label="Mensagens">
                {% for message in messages %}
                    <p class="message message-{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </section>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
