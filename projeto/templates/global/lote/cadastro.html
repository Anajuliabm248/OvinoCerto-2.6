{% extends 'global/base.html' %}

{% block content %}
  <section class="panel form-panel">
    <div class="panel-header">
      <div>
        <h1>Cadastrar Lote</h1>
        <p class="panel-subtitle">
          <a href="{% url 'propriedade:listar' %}">Propriedades</a> &rsaquo;
          <a href="{% url 'lote:listar' propriedade_id=propriedade.id %}">{{ propriedade.nome }}</a> &rsaquo;
          Novo lote
        </p>
      </div>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'global/partials/_form_field.html' %}
      <div class="actions">
        <button class="button" type="submit">Cadastrar</button>
        <a class="button button-secondary" href="{% url 'lote:listar' propriedade_id=propriedade.id %}">Cancelar</a>
      </div>
    </form>
  </section>

  <script>
    // Filtra as opções de fase conforme categoria e idade selecionadas
    const fasesValidas = {
      cordeiro: {
        ate_4_meses: ['crescimento'],
        ate_8_meses: ['crescimento'],
        ate_12_meses: ['crescimento'],
        mais_12_meses: ['crescimento'],
      },
      carneiro: {
        ate_4_meses: ['crescimento'],
        ate_8_meses: ['crescimento'],
        ate_12_meses: ['crescimento', 'manutencao'],
        mais_12_meses: ['manutencao', 'pre_cobricao'],
      },
      ovelha: {
        ate_4_meses: ['crescimento'],
        ate_8_meses: ['crescimento'],
        ate_12_meses: ['crescimento', 'manutencao'],
        mais_12_meses: [
          'manutencao', 'reproducao', 'gestacao_precoce',
          'gestacao_tardia', 'inicio_lactacao', 'meio_lactacao', 'lactacao_tardia',
        ],
      },
    };

    const fasesComParto = [
      'gestacao_precoce', 'gestacao_tardia',
      'inicio_lactacao', 'meio_lactacao', 'lactacao_tardia',
    ];

    const categoriaEl = document.getElementById('id_categoria');
    const idadeEl    = document.getElementById('id_idade');
    const faseEl     = document.getElementById('id_fase');
    const partoRow   = document.getElementById('id_tipo_parto')?.closest('.form-field');
    const diasRow    = document.getElementById('id_dias_fase')?.closest('.form-field');

    function atualizarFases() {
      const cat   = categoriaEl?.value;
      const idade = idadeEl?.value;
      if (!cat || !idade || !faseEl) return;

      const permitidas = (fasesValidas[cat] || {})[idade] || [];
      Array.from(faseEl.options).forEach(opt => {
        if (opt.value === '') return;
        opt.hidden   = permitidas.length > 0 && !permitidas.includes(opt.value);
        opt.disabled = opt.hidden;
      });

      if (faseEl.value && !permitidas.includes(faseEl.value)) {
        faseEl.value = permitidas[0] || '';
      }
      atualizarCamposParto();
    }

    function atualizarCamposParto() {
      const fase = faseEl?.value;
      const mostra = fasesComParto.includes(fase);
      if (partoRow) partoRow.style.display = mostra ? '' : 'none';
      if (diasRow)  diasRow.style.display  = mostra ? '' : 'none';
    }

    categoriaEl?.addEventListener('change', atualizarFases);
    idadeEl?.addEventListener('change', atualizarFases);
    faseEl?.addEventListener('change', atualizarCamposParto);

    // Inicializa ao carregar
    atualizarFases();
  </script>
{% endblock %}
