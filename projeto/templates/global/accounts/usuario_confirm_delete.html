{% extends 'global/base.html' %}

{% block content %}
    <section class="panel form-panel">
        <h1>Excluir usuario</h1>
        <p>Confirme a exclusao de {{ usuario_editado.first_name|default:usuario_editado.username }}.</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <button class="button button-danger" type="submit">Excluir</button>
                <a class="button button-secondary" href="{{ cancelar_url }}">Cancelar</a>
            </div>
        </form>
    </section>
{% endblock %}
